name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<9" "ruff>=0.12,<1"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: python -m pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  demo_http:
    name: Live demo HTTP journey
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      # Force the deterministic rule-based provider. Never spend AI tokens in CI.
      OPENAI_API_KEY: ""
      BIZLENS_AI_MODEL: ""
      BIZLENS_BASE_RPC_ENABLED: ""
      BIZLENS_API_URL: http://127.0.0.1:8000
      BIZLENS_WEB_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build real web application
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Start backend and web processes
        run: |
          python -m uvicorn apps.api.app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/bizlens-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bizlens-api.pid"
          (
            cd apps/web
            npm run start -- --hostname 127.0.0.1 --port 3000
          ) > "$RUNNER_TEMP/bizlens-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bizlens-web.pid"

      - name: Verify Next.js-to-FastAPI HTTP journey
        run: python scripts/demo_http_smoke.py

      - name: Include server logs on error
        if: failure()
        run: |
          echo "=== API server ==="
          tail -n 100 "$RUNNER_TEMP/bizlens-api.log" || true
          echo "=== Web server ==="
          tail -n 100 "$RUNNER_TEMP/bizlens-web.log" || true
