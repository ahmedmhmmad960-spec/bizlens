name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<9" "ruff>=0.12,<1"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: python -m pytest

      - name: Verify isolated wheel install and developer CLI
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/bizlens-wheel" .
          python -m pip install --no-deps --target "$RUNNER_TEMP/bizlens-site" \
            "$RUNNER_TEMP/bizlens-wheel"/bizlens-*.whl
          (
            cd "$RUNNER_TEMP"
            PYTHONPATH="$RUNNER_TEMP/bizlens-site" python -m bizlens_toolkit usdc-demo
          )

      - name: Developer Toolkit golden and Base contract
        run: |
          python -m bizlens_toolkit verify-golden \
            --csv tests/fixtures/golden/order_lines.csv \
            --expected tests/fixtures/golden/order_lines.expected.json
          python -m bizlens_toolkit verify-golden \
            --csv tests/fixtures/golden/profit_reversal.csv \
            --expected tests/fixtures/golden/profit_reversal.expected.json
          python -m bizlens_toolkit usdc-demo
          python -m examples.developer_toolkit.quickstart
          # Real explorer reference is pinned; CI does not make live chain calls.
          python -m examples.developer_toolkit.base_sepolia_reference

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  demo_http:
    name: Live demo HTTP journey
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      # Force the deterministic rule-based provider. Never spend AI tokens in CI.
      OPENAI_API_KEY: ""
      BIZLENS_AI_MODEL: ""
      BIZLENS_BASE_RPC_ENABLED: ""
      BIZLENS_API_URL: http://127.0.0.1:8000
      BIZLENS_WEB_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build real web application
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Start backend and web processes
        run: |
          python -m uvicorn apps.api.app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/bizlens-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bizlens-api.pid"
          (
            cd apps/web
            npm run start -- --hostname 127.0.0.1 --port 3000
          ) > "$RUNNER_TEMP/bizlens-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bizlens-web.pid"

      - name: Verify Next.js-to-FastAPI HTTP journey
        run: python scripts/demo_http_smoke.py

      - name: Launch preinstalled headless Chrome (local-only)
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No preinstalled Chrome binary available; browser gate remains open."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bizlens-browser"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 \
            --user-data-dir="$RUNNER_TEMP/bizlens-chrome-profile" \
            --window-size=1440,900 about:blank \
            > "$RUNNER_TEMP/bizlens-chrome.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bizlens-chrome.pid"

      - name: Verify real Chrome click-through and mobile layout
        timeout-minutes: 3
        env:
          BIZLENS_BROWSER_SCREENSHOT_DIR: ${{ runner.temp }}/bizlens-browser
        run: python scripts/browser_cdp_smoke.py

      - name: Attach synthetic-only browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bizlens-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/bizlens-browser/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Include server logs on error
        if: failure()
        run: |
          echo "=== API server ==="
          tail -n 100 "$RUNNER_TEMP/bizlens-api.log" || true
          echo "=== Web server ==="
          tail -n 100 "$RUNNER_TEMP/bizlens-web.log" || true
