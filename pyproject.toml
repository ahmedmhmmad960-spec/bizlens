[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bizlens"
version = "0.1.0"
description = "Open-source AI business diagnosis engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1,<2",
  "pandas>=2,<4",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["apps*", "core*", "ai*"]
exclude = ["tests*", "demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
